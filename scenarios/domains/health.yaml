response_rules:
  - "Do NOT interpret symptoms, suggest treatments, or comment on diagnoses"
  - "Acknowledge the concern briefly"
  - "Redirect to medical professionals"

redirects:
  medical_emergency:
    trigger_phrases:
      - "bleeding"
      - "ambulance"
      - "emergency"
      - "can't breathe"
      - "chest pain"
      - "unconscious"
      - "not breathing"
      - "seizure"
      - "overdose"
    response: "If this is an emergency, call 911 (or your local emergency number) immediately. I cannot provide medical advice—emergency responders can guide you while help is on the way. Please call now."

  symptom_inquiry:
    trigger_phrases:
      - "what does this symptom mean"
      - "is this serious"
      - "should I be worried about"
      - "do I have"
    response: "Health concerns deserve professional attention, not my speculation. Have you been able to talk to a doctor about this?"

  medication_question:
    trigger_phrases:
      - "should I take"
      - "stop taking my medication"
      - "side effects"
      - "is this medicine"
    response: "Medication decisions need medical expertise I don't have. Please talk to your doctor or pharmacist about this."

  mental_health_treatment:
    trigger_phrases:
      - "is therapy working"
      - "should I see a therapist"
      - "need professional help"
    response: "Seeking professional mental health support is a meaningful step. What's making you think about this right now?"

  health_anxiety:
    trigger_phrases:
      - "I keep worrying about my health"
      - "can't stop thinking about being sick"
      - "afraid something is wrong"
    response: "Health anxiety is real and difficult. The worry itself is worth addressing. Have you been able to share these concerns with a doctor or counselor?"

  substance_abuse:
    trigger_phrases:
      - "addicted to"
      - "addiction"
      - "can't stop using"
      - "drug problem"
      - "drinking problem"
      - "substance abuse"
    response: "Addiction is a medical issue, not a character flaw. This needs professional support, not AI advice. SAMHSA's helpline (1-800-662-4357) offers free, confidential help 24/7. Is there someone in your life you could reach out to?"

  helping_someone_with_addiction:
    trigger_phrases:
      - "friend is addicted"
      - "friend who is addicted"
      - "someone I know is addicted"
      - "family member addicted"
      - "loved one struggling with"
      - "help my friend with addiction"
      - "advice for someone addicted"
    response: "Supporting someone with addiction is hard. This is outside what I can safely help with—it needs professional guidance. SAMHSA (1-800-662-4357) also helps families and friends. Who in your life could you talk to about this?"

  mental_health_concern:
    trigger_phrases:
      - "I think I have depression"
      - "I might be depressed"
      - "anxiety is overwhelming"
      - "can't cope"
      - "mental health struggling"
    response: "What you're describing matters and deserves proper support. Have you been able to talk to a mental health professional? If not, that would be a meaningful first step."

  chronic_condition:
    trigger_phrases:
      - "chronic pain"
      - "chronic illness"
      - "living with disability"
      - "autoimmune"
      - "terminal diagnosis"
    response: "Living with a chronic condition is a daily reality that deserves proper support. A support group for your specific condition, or a counselor who specializes in chronic illness, could offer what I can't."

  reproductive_health:
    trigger_phrases:
      - "miscarriage"
      - "trying to conceive"
      - "infertility"
      - "pregnancy loss"
      - "postpartum"
    response: "Reproductive health concerns carry deep emotional weight. Your healthcare provider is the right person for medical guidance, and a counselor who specializes in this area can help with the emotional side."

  crisis_adjacent:
    trigger_phrases:
      - "suicidal thoughts"
      - "thinking about ending"
      - "don't want to be here"
    response: "I hear you, and I'm concerned. Please reach out to a crisis line right now: 988 (US) or findahelpline.com. You deserve real human support, not software."

# Phase 25.1: the concrete route offered when a health reply would otherwise
# just decline. Language is clinician-shapeable (Phase 24 `form_editable`);
# the decision to *always* offer one is not.
referrals:
  professional: "a GP or pharmacist"
  line: "A GP or pharmacist can actually look at this - worth booking rather than sitting with it."

# Phase 25 / #214: requests for clinical authority that are refused in EVERY
# mode, including when is_practical_technique flips the reply to full
# assistant mode. The bypass produced Accutane dosing - and compliance with
# "what bloods to skip" - for a drug the user said they bought online.
#
# Deliberately narrow: "how do I do a proper squat" and "what are good sleep
# habits" must still get real help. These phrases ask the app to BE the
# clinician, not to explain something.
specialist_requests:
  triggers:
    - "what dose"
    - "what dosage"
    - "how many mg"
    - "how much should i take of"
    - "how much of it should i take"
    - "dose, months"
    - "dosing protocol"
    - "bloods to skip"
    - "tests to skip"
    - "skip liver"
    - "you're my derm"
    - "you are my derm"
    - "be my doctor"
    - "you're my doctor"
    - "diagnose me"
    - "do i have cancer"
    - "do i have an infection"
    - "stop taking my medication"
    - "stop taking my meds"
    - "stop taking my pills"
    - "double my dose"
  response: |
    I'm not going to write that. Dosing, monitoring and whether to stop a
    medication are decisions that need someone who can see your history and
    examine you - getting them wrong causes real harm, and I can't check
    anything about you.

    A GP or pharmacist can do this properly. A pharmacist will talk to you
    without an appointment.
