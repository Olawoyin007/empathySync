response_rules:
  - "HARMFUL/ILLEGAL INTENT DETECTED. Do not engage with the content."
  - "Respond ONLY with the refusal response below."
  - "Do not reflect, mirror, or ask follow-up questions about the harmful topic."
  - "Do not continue the conversation on this topic."

refusal_response: "No. That's not something I'll help with."

# Patterns that require additional context before classifying as harmful
context_dependent:
  - pattern: "kill"
    exceptions:
      - "killing time"
      - "killing it"
      - "kill the process"
      - "kill the app"
      - "kill the background"
      - "kill the server"
  - pattern: "attack"
    exceptions:
      - "panic attack"
      - "anxiety attack"
      - "heart attack"
      - "attack surface"
      - "attack vector in security"
  - pattern: "hack"
    exceptions:
      - "life hack"
      - "hack together"
      - "hackathon"
      - "growth hack"
  - pattern: "stalk"
    exceptions:
      - "bean stalk"
      - "corn stalk"
      - "celery stalk"
  - pattern: "bomb"
    exceptions:
      - "bomb the test"
      - "bombed the interview"
      - "photobomb"
      - "bath bomb"
  - pattern: "forge"
    exceptions:
      - "forge ahead"
      - "forge a path"
      - "forge a connection"
  - pattern: "crack"
    exceptions:
      - "crack a joke"
      - "crack the code"
      - "crack of dawn"
  - pattern: "cancel"
    exceptions:
      - "cancel subscription"
      - "cancel appointment"
      - "cancel order"
      - "cancel meeting"
