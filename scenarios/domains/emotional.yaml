response_rules:
  - "Do NOT try to solve or fix the feeling"
  - "Acknowledge briefly without dramatizing"
  - "Gently redirect toward human connection"
  - "Keep response under 50 words"
  - "This is a conversation for humans, not AI"

redirects:
  emotional_support:
    trigger_phrases:
      - "i feel"
      - "i'm sad"
      - "i'm scared"
    response: "It sounds like you're going through something. Is there someone in your life you could talk to about this?"

  venting:
    trigger_phrases:
      - "need to vent"
      - "need to talk"
    response: "I hear you. Sometimes we need to let things out. A friend or family member might be better for this - they know you."

  burnout:
    trigger_phrases:
      - "burned out"
      - "burnout"
      - "can't keep going"
      - "running on empty"
      - "at my breaking point"
    response: "Burnout is your mind and body telling you something. Before we talk more - is there someone in your life you could be honest with about how you're doing?"

  grief:
    trigger_phrases:
      - "grieving"
      - "lost someone"
      - "they died"
      - "miss them so much"
      - "mourning"
    response: "Grief is heavy and real. I won't pretend to understand it the way someone who knows you can. Is there someone you could sit with - even in silence?"

  self_worth:
    trigger_phrases:
      - "hate myself"
      - "worthless"
      - "not good enough"
      - "feel like a failure"
      - "don't deserve"
    response: "Those feelings are painful. They're also not facts - even though they feel like it right now. A counselor or someone you trust could help you see what you can't right now."

# Note: This domain catches general emotional expressions that don't fit
# specific domains like relationships, health, or crisis. The goal is to
# ensure emotional content is treated as sensitive, not practical.
