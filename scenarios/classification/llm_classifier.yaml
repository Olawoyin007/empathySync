      emotional_intensity: 7
      is_personal_distress: true
      is_practical_technique: false
      confidence: 0.8
    explanation: "Financial anxiety in context of job interview prep. Not a standalone money question - they need interview help, not financial advice."

  - message: "I'm so stressed about this deadline, my boss is going to fire me"
    recent_context: "user: Help me write this report\nassistant: Here's a draft structure..."
    classification:
      domain: "logistics"
      emotional_intensity: 6
      is_personal_distress: false
      is_practical_technique: false
      confidence: 0.85
    explanation: "Work stress expressed during a practical task. Still needs help with the report, not a health intervention."

  - message: "I've been having panic attacks every night for months, I can't sleep"
    recent_context: "user: Help me prepare for a job interview\nassistant: Here's a checklist..."
    classification:
      domain: "health"
      emotional_intensity: 9
      is_personal_distress: true
      is_practical_technique: false
      confidence: 0.9
    explanation: "Genuine health concern - chronic symptoms unrelated to the practical task. This IS a real domain shift."

# Keywords that ALWAYS trigger fast-path (safety-critical, skip LLM)
# These bypass LLM classification entirely for safety
fast_path_crisis:
  - "kill myself"
  - "end my life"
  - "suicide"
  - "want to die"
  - "don't want to live"
  - "better off dead"
  - "no reason to live"
  - "take my own life"
  - "thinking drowning"
  - "don't want to exist"
  - "don't want to be here"
  - "wish I wasn't alive"
  - "tired of living"
  - "tired of being alive"
  - "rather be dead"
  - "writing goodbye letters"
  - "saying goodbye to everyone"
  - "have a plan to end"
  - "standing on the edge"
  - "on the bridge"
  - "have pills ready"
  - "don't see the point anymore"
  - "no point anymore"
  - "tired of fighting"
  - "tired of trying"
  - "can't keep fighting"
  - "can't keep going"
  - "don't want to keep going"
  - "what's the point of anything"
  - "nothing to live for"
  - "everything feels hopeless"
  - "feel completely hopeless"
  - "given up on everything"
  - "ready to give up on everything"
  - "don't want to be here anymore"
  - "can't do this anymore"
  - "won't be here much longer"
  - "not going to be around"

fast_path_harmful:
  - "kill someone"
  - "murder"
  - "how to make a bomb"
  - "how to poison"
  - "hurt someone"
  - "attack someone"
  - "how to make a weapon"
  - "how to stalk someone"
  # Cybercrime — these are always harmful regardless of framing
  - "hack into"
  - "get into their account"
  - "access their account"
  - "their private messages"
  - "someone's private messages"
  # Forgery — always harmful
  - "fake id"
  - "fake identification"
  - "make a fake"
  - "forged id"
  # Physical crime
  - "pick a lock"
  - "lock picking"
  - "lockpicking"
  # Surveillance
  - "find out where someone lives"
  - "find someone's address"
  # CSAM - zero tolerance
  - "child pornography"
  - "child sexual abuse"
  - "csam"
  - "minor solicitation"
  # Weapons of mass destruction
  - "bioweapon"
  - "biological weapon"
  - "chemical weapon"
  - "nerve agent"
  # Hired violence
  - "hire a hitman"
  - "hire an assassin"
  - "contract killer"
  # Malware
  - "write malware"
  - "develop malware"
  - "keylogger script"
  - "write a keylogger"
  # Holocaust denial / hate speech
  - "holocaust denial"
  - "holocaust never happened"
  - "commit ethnic genocide"
  - "carry out ethnic genocide"

# Confidence threshold below which we fall back to keyword matching
confidence_threshold: 0.6

# Cache settings
cache:
  enabled: true
  max_entries: 100
  ttl_seconds: 3600  # 1 hour
