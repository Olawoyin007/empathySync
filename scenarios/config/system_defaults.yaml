# system_defaults.yaml — Central configuration for all tunables in empathySync.
#
# Every bare numeric literal that a contributor might want to adjust lives here.
# Code loads these via ScenarioLoader.get_system_defaults() and falls back to
# hardcoded values if this file is missing (backward compatibility).
#
# Each section corresponds to a component in src/.

# --- Ollama / LLM ---
ollama:
  practical_max_tokens: 5000      # Token limit for practical tasks (emails, code, etc.)
  reflective_max_tokens: 300      # Token limit for emotional/reflective responses
  practical_timeout_seconds: 240  # Timeout for practical generation
  reflective_timeout_seconds: 45  # Timeout for reflective generation
  max_input_length: 5000          # Truncate user input beyond this length (prevents OOM)

classification:
  cache_max_entries: 100          # LRU cache size for LLM classification results
  few_shot_examples: 3            # Number of few-shot examples in classification prompt
  confidence_threshold: 0.6       # Minimum LLM confidence to accept classification
  context_lookback_messages: 10   # Recent messages included in classification context
  # Phase 17.2: Confidence calibration tiers
  # False positive (over-restrict) is safer than false negative (miss crisis) on sensitive topics
  confidence_high: 0.85           # Trust classification fully - no override
  confidence_medium: 0.60         # Trust but apply sanity check for sensitive domains
  confidence_low: 0.40            # Fall back to keyword + apply safety restraints on sensitive domains

# --- Session & Turn Limits ---
session:
  turn_limits:
    logistics: 30
    money: 15
    health: 15
    relationships: 15
    spirituality: 10
    crisis: 1
    harmful: 1
  identity_reminder_frequency: 9  # Remind user "I'm an AI" every N turns (was 6 - felt preachy)
  post_crisis_clear_after: 3      # Clear post-crisis state after N turns

# --- Context Persistence (Phase 6.5) ---
context:
  decay_turns:
    reflection_redirect: 7        # Longest persistence (most sensitive)
    high_weight: 5
    crisis: 6
    relationships: 6
    default: 4
  domain_stability_streak: 3      # Consecutive turns before domain is "established"
  domain_shift_intensity: 5       # Intensity >= this allows domain shift
  continuation_max_length: 30     # Messages shorter than this may be continuations
  topic_hints_limit: 5            # Max extracted topic hints per message
  emotional_coloring_min_intensity: 3  # Minimum intensity for emotional acknowledgment

# --- Response Processing ---
response:
  min_valid_length: 10            # Responses shorter than this are treated as failures
  brevity_risk_threshold: 7       # Risk weight >= this triggers word count enforcement
  brevity_max_words: 60           # Max words before truncation at high risk
  brevity_truncate_to: 50         # Truncate to this many words
  high_risk_log_threshold: 5      # Risk weight >= this triggers detailed logging

# --- Risk Scoring ---
risk:
  intensity_weight: 0.3           # Weight of emotional intensity in risk calculation
  dependency_weight: 0.2          # Weight of dependency risk in risk calculation
  dependency_intervention_threshold: 5  # Combined dependency score triggering intervention

# --- Dependency Detection ---
dependency:
  base_factor: 0.7                # Multiplier for message count in dependency calculation
  base_cap: 6.0                   # Maximum base dependency score
  repetition_boost_max: 4.0       # Maximum boost from message repetition
  lookback_messages: 12           # Messages to examine for dependency patterns
  prefix_length: 60               # Character prefix length for repetition detection

# --- Domain Detection ---
domain:
  short_continuation_max_length: 40  # Max length for short continuation bypass
  established_streak: 2              # Domain streak before skipping LLM for same domain
  shift_min_triggers: 2              # Minimum triggers required to shift established domain

# --- Anti-Engagement Scoring ---
anti_engagement:
  weights:
    sensitive_sessions: 0.35
    connection_seeking: 0.25
    late_night: 0.20
    escalation: 0.20
  late_night_hours:
    start: 22                     # 10 PM
    end: 6                        # 6 AM
  thresholds:
    sessions_high: 7              # 7+ sensitive sessions/day = high concern (practical sessions excluded)
    sessions_moderate: 5
    sessions_low: 3
    minutes_high: 180             # 3+ hours/day total (raised from 120 - practical use unconstrained)
    minutes_moderate: 90          # 1.5+ hours/day
    late_night_sessions: 3        # 3+ late-night sessions
    dependency_cooldown: 8        # Score triggering cooldown
    break_suggestion: 5           # Score suggesting a break
  escalation_lookback_days: 14    # Two-week window for trend detection
  escalation_threshold: 1.5       # 50% increase triggers concern
  health_score_levels:
    excellent: 2
    good: 4
    moderate: 6
    concerning: 8

# --- Wisdom Features (Phase 8) ---
wisdom:
  friend_mode_min_length: 20      # Minimum message length to trigger friend mode
  journaling_prompts_limit: 3     # Max journaling prompts shown
  self_report_frequency_days: 5   # Minimum days between self-report prompts
  intent_check_in:
    min_sessions_between: 3       # Sessions before showing intent check-in
    max_days_between: 7           # Days before forcing intent check-in

# --- Connection Seeking ---
connection:
  lookback_days: 30               # Default lookback for connection frequency
  concerning_ratio: 0.3           # Connection-seeking ratio threshold
  concerning_min_count: 3         # Minimum count for concern flag
  high_usage_week_sessions: 5     # Sessions/week threshold for high usage flag

# --- Data Retention ---
retention:
  max_handoff_events: 200
  max_self_reports: 100
  max_task_pattern_uses: 100
  max_policy_events: 1000
  historical_days: 3650           # ~10 years for full history queries

# --- Restraint Memory (Phase 23.1) ---
# The exhaustive allowlist of persistable fields. This is the negative
# invariant that makes "memory as guardrail, not rapport" falsifiable:
# tests/test_restraint_memory.py serializes every persisted structure and
# fails the build if ANY field outside this list is written. Adding a field
# here is a conscious, reviewed decision - never a side effect.
#
# Consciously allowed free-text fields (user-entered form input, never
# conversation transcript or derived preference/persona data):
#   check_ins.notes            - the daily check-in note the user types
#   independence_records.notes - the "I did it myself" note the user types
#   self_reports.response      - the user's answer to a self-report prompt
#   people.* / reach_outs.*    - trusted-network contact data the user enters
#   handoffs.message_preview   - first 100 chars of the outreach message the
#                                user sent to a trusted person (powers the
#                                handoff follow-up); outreach text, not
#                                conversation content
# Free-form "details" dicts are additionally scanned against the forbidden
# key names below.
restraint_memory:
  forbidden_field_names:        # must not appear ANYWHERE in persisted data
    - message
    - messages
    - content
    - conversation
    - transcript
    - user_input
    - prompt
    - persona
    - preference
    - preferences
    - profile
  allowed_fields:
    wellness_root: [schema_version, created_at, check_ins, usage_sessions,
                    policy_events, session_intents, task_patterns,
                    independence_records, handoff_events, self_reports]
    check_ins: [date, datetime, feeling_score, notes]
    usage_sessions: [date, datetime, domains_touched, duration_minutes, hour,
                     max_risk_weight, turn_count]
    policy_events: [action_taken, date, datetime, domain, policy_type, risk_weight]
    session_intents: [auto_detected, date, datetime, intent, was_check_in]
    task_patterns: [count, count_at_last_shown, dismissal_count, first_use,
                    graduation_shown_count, last_dismissal, last_graduation_shown,
                    last_use, uses]
    task_pattern_uses: [date, datetime]
    independence_records: [category, date, datetime, notes]
    handoff_events: [context, date, datetime, details, domain, event_type, outcome]
    self_reports: [date, datetime, details, response, type]
    network_root: [schema_version, created_at, people, reach_outs, handoffs]
    people: [added_at, contact, domains, id, last_contact, name, notes, relationship]
    reach_outs: [date, datetime, method, notes, person_name, topic]
    handoffs: [context, date, datetime, domain, follow_up_shown, id,
               message_preview, outcome, person_name, status]
  # SQLite column allowlist (column names diverge from the JSON field names).
  # Structural/bookkeeping columns carry no user data. Legacy exceptions are
  # deny-named columns that predate the invariant. Schema v3 dropped the dormant
  # session_intents.user_input column; renaming self_reports.content to response
  # remains deferred (touches both backends and unversioned JSON data).
  allowed_columns:
    schema_info: [version, migrated_at, description]
    check_ins: [id, feeling_score, notes, created_at]
    usage_sessions: [id, started_at, ended_at, duration_minutes, turn_count,
                     max_risk_weight, domains_touched, intent, created_at]
    policy_events: [id, session_id, event_type, domain, action_taken,
                    explanation, risk_weight, created_at]
    session_intents: [id, session_id, intent, created_at]
    independence_records: [id, task_category, milestone, notes, created_at]
    handoff_events: [id, handoff_type, domain, person_name, completed, notes, created_at]
    self_reports: [id, report_type, content, score, created_at]
    task_patterns: [id, pattern_type, count, last_seen, metadata, created_at]
    trusted_people: [id, name, relationship, contact, notes, domains, added_at, last_contact]
    reach_outs: [id, person_id, method, notes, outcome, created_at]
  legacy_deny_named_columns:
    self_reports: [content]         # holds the user's self-report answer; rename deferred to a future migration
