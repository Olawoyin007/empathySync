# Connection Steering - Background warmth modifier
#
# When isolation is detected ("there is no one really", "I have nobody", etc.),
# a persistent background modifier activates for the session. It changes the
# texture of responses - not the topic. The user should not feel steered.
# They should just feel slightly more noticed than usual.
#
# This is the same mechanic engagement algorithms use for retention - subtle,
# woven into ordinary interactions - but pointed at human connection, not
# AI dependency.

isolation_signals:
  # Direct signals - unambiguous statements of having no one
  direct:
    - "there is no one"
    - "there's no one"
    - "i have no one"
    - "have no one"
    - "nobody to talk to"
    - "no one to talk to"
    - "i'm completely alone"
    - "completely alone"
    - "i have nobody"
    - "i've got nobody"
    - "don't have anyone"
    - "nobody understands"
    - "no one understands"
    - "i've lost everyone"
    - "i'm isolated"
    - "no family"
    - "no friends"
    - "all alone"
    - "i'm alone"
    - "no one really"

  # Passive signals - softer expressions that hint at connection void
  passive:
    - "i manage alone"
    - "i deal with it alone"
    - "i do it by myself"
    - "people moved away"
    - "we drifted apart"
    - "i stopped reaching out"
    - "i pushed everyone away"
    - "not really anyone"
    - "not really close to anyone"
    - "lost touch"
    - "i've lost touch"
    - "no one really"
    - "not really"

steering:
  system_prompt_addition: |
    ## BACKGROUND CONTEXT - DO NOT SURFACE THIS
    Earlier in this conversation the user mentioned being isolated or having no one around.
    This is NOT the topic of this response. Do not bring it up. Do not ask about it.
    Do not reference this note in any way.

    Complete whatever the user is asking for, fully and well. But carry warmth in how you do it.

    - When the user mentions a person by name or role (colleague, friend, neighbour,
      anyone at all), notice them briefly and naturally - not as a topic, just as a human moment.
    - If the user asks you to draft a message TO someone, do it thoroughly. If reaching out
      feels like a meaningful act given what they shared, you may acknowledge that once at the
      end - briefly and lightly. ("Good move reaching out." / "That's worth sending.")
    - If the user brings up their isolation again unprompted, respond briefly and warmly,
      then return to whatever they need. Do not dwell or expand.
    - One warm human moment per response, maximum. Zero is fine. Never force it.
    - BANNED words and phrases: "support network", "explore", "unpack", "process",
      "I hear you", "that sounds difficult", "is that something you'd want to change",
      "reach out to someone", "talk to someone", "the nature of", "represent a potential",
      "sit with", "validate"

  session_end_note:
    active: "Isolation detected. Background warmth modifier was active this session."
    dormant: "Isolation detected but user stayed on practical tasks throughout."
